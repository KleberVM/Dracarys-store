{% load static %}
<link rel="stylesheet" href="{% static 'personalizar.css' %}">
<div class="menu-perfil">
    <img id="previewed" src="{% if user.foto %}{{ user.foto.url }}{% else %}https://via.placeholder.com/150{% endif %}" alt="Foto de Perfil">
    <ul class="lista-perfil">
        <li><a href="{% url 'perfil' %}">Perfil</a></li>
        <li><a href="{% url 'ofertar' %}" class="ofertarMa"> Ofertar Material</a></li>
        <li><a href="{% url 'mis_materiales' %}">Mis Materiales</a></li>
        <li><a href="#" id="openVentanaEstilos">Estilos</a></li>
        <li><a href="#">Cambiar Logo</a></li>        
        <li><a href="{% url 'logout' %}" id= "cerrarSesionPerfil" class="logoutS">Cerrar sesión</a></li>
    </ul>
</div>


<!-- Ventana flotante -->
<div id="ventana-Estilos" class="ventana-estilos-modal">
    <div class="ventana-estilos-content">
        <H2>Elije un Tema</H2>
        <span class="ventana-estilos-close">&times;</span>
        <div class="ventana-estilos-image-container">
            <img src="{% static 'temas/1.png' %}" alt="Imagen 1" class="selectable-image">
            <img src="{% static 'temas/2.png' %}" alt="Imagen 2" class="selectable-image">
            <img src="{% static 'temas/3.png' %}" alt="Imagen 3" class="selectable-image">
            <img src="{% static 'temas/4.png' %}" alt="Imagen 4" class="selectable-image">
        </div>
        <!-- <p id="selected-image-info">Ninguna imagen seleccionada</p> -->
    </div>
</div>

<script src="{% static 'personalizar.js' %}"></script>
